<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juego de optimización</title>
<style>
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{margin:0;background:#ffffff;color:#1b1b1b;font-size:17px;line-height:1.5}
header{background:#2e7d32;color:#fff;padding:10px 16px}
.hd{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.hd img{height:44px;width:auto;background:#fff;border-radius:4px;padding:2px}
.hd h1{margin:0;font-size:19px;line-height:1.2}
.hd small{display:block;font-size:13px;opacity:.9;font-weight:normal}
.cover{display:flex;align-items:center;gap:14px;border-bottom:2px solid #a5d6a7;padding-bottom:14px;margin-bottom:16px}
.cover img{height:80px;width:auto}
.cover div{font-size:15px;line-height:1.4}
.cover b{color:#1b5e20;font-size:17px}
main{max-width:560px;margin:0 auto;padding:14px}
.hud{display:flex;justify-content:space-between;border:1px solid #2e7d32;padding:8px 12px;margin-bottom:14px;font-weight:bold;font-size:15px;color:#2e7d32}
h2{font-size:21px;margin:0 0 10px;color:#2e7d32}
p{margin:0 0 12px}
ul,ol{padding-left:22px;margin:0 0 12px}li{margin:4px 0}
.enun{background:#e8f5e9;border-left:5px solid #2e7d32;padding:10px 12px;margin-bottom:12px}
svg{width:100%;height:auto;display:block;border:1px solid #a5d6a7;background:#fff}
.ctl{margin:12px 0 2px;font-weight:bold}
.ctl b{color:#2e7d32}
input[type=range]{width:100%;height:34px;accent-color:#2e7d32}
.read{border:1px solid #a5d6a7;padding:8px 12px;margin:8px 0}
.read .main{font-size:22px;font-weight:bold;color:#2e7d32}
.best{font-size:14px;color:#555}
.btn{display:block;width:100%;background:#2e7d32;color:#fff;border:0;padding:13px;font-size:17px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn.alt{background:#fff;color:#2e7d32;border:2px solid #2e7d32}
.btn:disabled{opacity:.4;cursor:default}
.box{background:#e8f5e9;border:1px solid #a5d6a7;padding:10px 12px;margin:10px 0}
.box.no{background:#f2f2f2;border-color:#bdbdbd}
.msg{margin-top:6px}
:focus-visible{outline:3px solid #1b5e20;outline-offset:2px}
</style>
</head>

<script>
var $=function(id){return document.getElementById(id)};
function money(v){return '$'+Math.round(v*1000).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
function num(v,d){return v.toFixed(d).replace('.',',')}

var G='#2e7d32',GL='#e8f5e9',GR='#bdbdbd';
var L=[
{name:'El precio de las arepas',goal:'max',
 story:'Un puesto de arepas gasta <b>$2.000</b> en hacer cada arepa. Cada día llegan 100 clientes, pero por cada <b>$1.000</b> que sube el precio se pierden <b>10 clientes</b>. ¿A qué precio es mayor la ganancia del día?',
 min:2,max:10,step:0.5,x0:3,
 xlabel:'Precio de cada arepa',xfmt:function(p){return money(p)},
 flabel:'Ganancia del día',ffmt:function(v){return money(v)},bestlabel:'Mejor ganancia encontrada',
 f:function(p){return (p-2)*(100-10*p)},ans:6,
 draw:function(p){var q=100-10*p,buy=q/5,s='<text x="160" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">Precio: '+money(p)+'</text>';
  for(var i=0;i<20;i++){var c=i%10,r=Math.floor(i/10),cx=22+c*30,cy=58+r*56,col=i<buy?G:GR;
   s+='<circle cx="'+cx+'" cy="'+cy+'" r="7" fill="'+col+'"/><rect x="'+(cx-8)+'" y="'+(cy+10)+'" width="16" height="22" rx="6" fill="'+col+'"/>'}
  s+='<text x="160" y="172" text-anchor="middle" font-size="12" fill="#1b1b1b">Verde: compran · Gris: no compran (cada figura = 5 clientes)</text>';return s},
 vb:'0 0 320 182',
 info:function(p){var q=100-10*p;return 'Clientes que compran: <b>'+q+'</b> de 100. Ganancia por arepa: <b>'+money(p-2)+'</b>'},
 hint:'La ganancia es G(p) = (p − 2)·(100 − 10p), con p en miles de pesos. Desarrolla, deriva e iguala a 0.',
 steps:['Ganancia = (precio − costo) · clientes, entonces G(p) = (p − 2)(100 − 10p) = −10p² + 120p − 200','G′(p) = −20p + 120 = 0, entonces p = 6','G″(p) = −20, que es menor que 0: es un <b>máximo</b>','Con p = 6 ($6.000) se venden 40 arepas y la ganancia es G(6) = 160, es decir <b>$160.000</b>']},
{name:'El corral',goal:'max',
 story:'Se tienen <b>80 m de malla</b> para hacer un corral rectangular junto a una pared (la pared no necesita malla). ¿Qué ancho x da el área máxima?',
 min:0,max:40,step:1,x0:5,
 xlabel:'Ancho x',xfmt:function(x){return num(x,0)+' m'},
 flabel:'Área del corral',ffmt:function(v){return num(v,0)+' m²'},bestlabel:'Mejor área encontrada',
 f:function(x){return x*(80-2*x)},ans:20,
 draw:function(x){var w=x*5,h=(80-2*x)*2.3,t=110-h/2;
  return '<line x1="54" y1="8" x2="54" y2="212" stroke="#757575" stroke-width="8"/><text x="28" y="112" text-anchor="middle" font-size="12" fill="#1b1b1b">pared</text><rect x="60" y="'+t+'" width="'+Math.max(w,1)+'" height="'+Math.max(h,1)+'" fill="'+GL+'" stroke="'+G+'" stroke-width="3"/><text x="'+(60+w/2)+'" y="218" text-anchor="middle" font-size="13" fill="#1b1b1b">x = '+num(x,0)+' m</text><text x="'+Math.min(60+w+6,262)+'" y="112" font-size="13" fill="#1b1b1b">y = '+num(80-2*x,0)+' m</text>'},
 vb:'0 0 320 224',
 info:function(x){return 'Largo: y = 80 − 2x = <b>'+num(80-2*x,0)+' m</b>'},
 hint:'La malla cubre 2 lados de x y 1 lado de y: 2x + y = 80. Despeja y, arma A(x) = x·y, deriva e iguala a 0.',
 steps:['Malla: 2x + y = 80, entonces y = 80 − 2x','A(x) = x(80 − 2x) = 80x − 2x²','A′(x) = 80 − 4x = 0, entonces x = 20','A″(x) = −4, que es menor que 0: es un <b>máximo</b>','x = 20 m, y = 40 m, área = <b>800 m²</b>']},
{name:'La caja',goal:'min',

  return '<rect x="'+(160-w/2)+'" y="'+t+'" width="'+w+'" height="'+hh+'" fill="'+GL+'" stroke="'+G+'" stroke-width="3"/><ellipse cx="160" cy="'+t+'" rx="'+(w/2)+'" ry="'+ry+'" fill="none" stroke="'+G+'" stroke-width="2" stroke-dasharray="5 4"/><text x="160" y="220" text-anchor="middle" font-size="13" fill="#1b1b1b">x = '+num(x,1)+' dm</text><text x="'+Math.min(160+w/2+6,250)+'" y="'+(y0-hh/2)+'" font-size="13" fill="#1b1b1b">h = '+num(32/(x*x),1)+' dm</text>'},

 steps:['Volumen: x²·h = 32, entonces h = 32/x²','Material: S = x² + 4xh = x² + 128/x','S′(x) = 2x − 128/x² = 0, entonces x³ = 64 y x = 4','S″(x) = 2 + 256/x³ = 6, que es mayor que 0: es un <b>mínimo</b>','x = 4 dm, h = 2 dm, material = 16 + 32 = <b>48 dm²</b>']}

 h.innerHTML='<div class="hud"><span>Problema '+(lv+1)+' de 3</span><span>Vidas: '+Math.max(0,3-tries)+'</span><span>Puntos: '+total+'</span></div>'}

function start(){lv=0;total=0;tries=0;hud(false);
 app.innerHTML='<div class="cover"><img alt="Escudo" src="'+$('crest').src+'"><div><b>Universidad de Cundinamarca</b><br>Sede Facatativá</div></div><h2>Antes de empezar</h2><p>Son 3 problemas de optimización. En cada uno debes encontrar el valor que da el <b>máximo</b> o el <b>mínimo</b>.</p><ol><li>Mueve el control y mira cómo cambia el resultado.</li><li>Cuando creas que lo encontraste, toca <b>Fijar mi respuesta</b>.</li><li>Tienes 3 vidas por problema. Ganas hasta 3 puntos por problema.</li><li>Al terminar cada problema verás cómo se resuelve con derivadas.</li></ol><button class="btn" id="go">Empezar</button>';
 $('go').onclick=level}

function level(){var l=L[lv];tries=0;hintUsed=false;best=null;hud(true);
 app.innerHTML='<h2>'+(lv+1)+'. '+l.name+'</h2><div class="enun">'+l.story+'</div><svg id="gs" viewBox="'+l.vb+'" role="img" aria-label="Dibujo del problema"></svg><div class="ctl">'+l.xlabel+': <b id="gx"></b></div><input id="gr" type="range" min="'+l.min+'" max="'+l.max+'" step="'+l.step+'" value="'+l.x0+'" aria-label="'+l.xlabel+'"><div class="read"><div>'+l.flabel+'</div><div class="main" id="gv"></div><div id="gi" style="font-size:15px;margin-top:4px"></div><div class="best" id="gb"></div></div><button class="btn" id="gf">Fijar mi respuesta</button><button class="btn alt" id="gh">Ver pista (−1 punto)</button><div class="msg" id="gm" aria-live="polite"></div>';
 var r=$('gr');
 function U(){var x=+r.value,v=l.f(x);
  if(best===null||(l.goal=='max'?v>best:v<best))best=v;
  $('gs').innerHTML=l.draw(x);$('gx').textContent=l.xfmt(x);$('gv').textContent=l.ffmt(v);$('gi').innerHTML=l.info(x);$('gb').textContent=l.bestlabel+': '+l.ffmt(best)}
 r.oninput=U;U();
 $('gh').onclick=function(){hintUsed=true;this.disabled=true;$('gm').innerHTML='<div class="box"><b>Pista:</b> '+l.hint+'</div>'};
 $('gf').onclick=function(){var x=+r.value;tries++;hud(true);
  if(Math.abs(x-l.ans)<=0.01){var s=Math.max(1,4-tries-(hintUsed?1:0));total+=s;hud(true);finish(l,s,true)}
  else if(tries>=3){finish(l,0,false)}
  else if(tries==1){$('gm').innerHTML='<div class="box no"><b>Incorrecto.</b> Mira el dato de "'+l.bestlabel.toLowerCase()+'": ¿mejora si te mueves un poco más en esa dirección?</div>'}
  else{hintUsed=true;$('gh').disabled=true;$('gm').innerHTML='<div class="box no"><b>Incorrecto.</b> Pista: '+l.hint+'</div>'}}}

function finish(l,s,ok){$('gr').disabled=true;$('gf').style.display='none';$('gh').style.display='none';
 var h=ok?'<div class="box"><b>¡Correcto!</b> '+(l.goal=='max'?'Encontraste el máximo.':'Encontraste el mínimo.')+' Ganaste '+s+(s==1?' punto.':' puntos.')+'</div>':'<div class="box no"><b>Se acabaron las vidas.</b> Estos son los pasos para resolverlo:</div>';
 h+='<div class="box"><b>Solución con derivadas:</b><ol>'+l.steps.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ol></div><button class="btn" id="gn">'+(lv<2?'Siguiente problema':'Ver resultado')+'</button>';
 $('gm').innerHTML=h;
 $('gn').onclick=function(){if(lv<2){lv++;level();window.scrollTo(0,0)}else{end()}}}

function end(){hud(false);
 var t=total>=8?'Excelente.':total>=5?'Bien.':'Repasa los criterios de la primera y la segunda derivada y vuelve a intentarlo.';
 app.innerHTML='<h2>Resultado</h2><div class="read"><div class="main">'+total+' de 9 puntos</div></div><p>'+t+'</p><div class="box"><b>En los 3 problemas hiciste lo mismo:</b><ol><li>Escribir la función que se quería maximizar o minimizar.</li><li>Derivar.</li><li>Igualar f′ = 0 y resolver.</li><li>Comprobar con f″ si era máximo o mínimo.</li></ol></div><p style="font-size:14px;color:#555;margin-top:16px;text-align:center">Docente: Henry Niño Quintero<br>Hecho por David Ramírez, Ian Gómez y Alejandro Sáenz Lozano</p><button class="btn" id="ag">Jugar de nuevo</button>';
 $('ag').onclick=start}

start();
</script>
</body>
